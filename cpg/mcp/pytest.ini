[pytest]
testpaths = tests
# `-m "not live"` DESELECTS the FalkorDB-dependent tests by default, so the
# standard run stays offline and fast even when FalkorDB happens to be up (a
# reachability-skip would not — it would run them). Opt in with
# `pytest cpg/mcp/tests -m live`: a command-line `-m` overrides this one.
# Same convention as falkor-chat/server/pyproject.toml.
addopts = -ra -m "not live"
markers =
    live: end-to-end test against a REAL FalkorDB on FALKORDB_HOST/PORT; deselected by default, run with `pytest cpg/mcp/tests -m live`
