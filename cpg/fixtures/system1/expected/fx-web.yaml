# fx-web expected manifest (S37). Source of truth: docs/test-plans/connected-code-graph-fixtures.md v1.2.
# Format follows fx-job.yaml (this builder's proposal; the S39 schema fixture-manifest-v1 does not exist yet and may rename keys).
# Locators: element "repoId:path::qname"; shorthand svc=fx-svc web=fx-web lib=fx-lib job=fx-job. Rows that join fx-web to
# another repository list BOTH locators (P provider, C consumer); locators in other repositories are verified by S39.
# Rows OV-2, OV-3, OV-5 also appear in fx-job.yaml (they place an fx-web locator and an fx-job change set).
version: 1
repo: fx-web
shorthands: {svc: fx-svc, web: fx-web, lib: fx-lib, job: fx-job}

units:
  - {unitId: web, repoId: fx-web, rootPath: "app/", lang: javascript, vendoredDirs: [vendor], gates: P1}

components: [api, mcp, bus, ui, plugins]   # directories app/src/<component>/; i18n, types, util, __tests__ and e2e hold only SK rows

build:
  steady: built   # SC-STEADY: unit web builds; fx-web is never an AB target

history:   # F-6 (fixture-manifest-v1): the checked-in tree is baseTree; H0 = baseTree + H0.ops; each later commit = its predecessor + its ops; forward ops only (add_file, replace_text, delete_file).
  repo: fx-web
  author: fixed (materializer)
  linear: true
  baseTree: cpg/fixtures/system1/fx-web/** (all files)
  commits:
  - id: H0
    date: '2026-01-05'
    message: initial tree
    ops: []
  - id: H1
    date: '2026-02-10'
    message: 'build point: unit web builds'
    allowEmpty: true
    ops: []
  branches: []

