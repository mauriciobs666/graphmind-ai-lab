cppBuildDecision:
  decision: gcc compilation database, not a clang build
  what: The C/C++ reference is scip-clang over a compile_commands.json produced by `cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON` and a full `cmake
    --build -j2` with the image gcc 13.3.0; no clang is installed or used to build (S24 removed apt clang; scip-clang carries its own Clang/LLVM
    21.1.8). Joern parses the corpus as-is (c2cpg takes the source tree, not the database), so the Joern runs do not depend on this choice.
  see: 'README.md "C/C++: gcc compilation database, not a clang build"'
