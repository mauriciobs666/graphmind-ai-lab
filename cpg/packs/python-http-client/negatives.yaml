# Call-site shapes the pack must NOT turn into a consumer, per lifting id (P1-49). Each case is a hand-built Python file
# (`imports`) holding one call `callee` (`resolution`, optional `external` target) whose first argument is the constant `a0`
# (or, with `a0: null`, none). Run by `negatives_failures` in tests/test_pack_python_http_client.py. A string or a comment naming
# `requests.get` has no call record at all, so it is the empty-file case `no-call-record`. Not a negative but a pinned residual
# limit (a URL-like argument of an untyped `.get(...)` in a file importing `requests` IS a consumer): see the test file.
negatives:
  py-get:
    dict-get-key: {imports: [requests], callee: get, resolution: external, external: "__builtin.dict.get", a0: key}
    dict-get-with-a-path-string: {imports: [requests], callee: get, resolution: external, external: "__builtin.dict.get", a0: /looks/like/a/path}
    environ-get: {imports: [requests], callee: get, resolution: external, external: "os.py:<module>.<member>(environ).get", a0: FX_PEER_BASE}
    untyped-get-of-a-config-key: {imports: [requests], callee: get, resolution: unresolved, a0: timeout}
    untyped-get-in-a-file-importing-no-http-client: {imports: [os, json], callee: get, resolution: unresolved, a0: /health}
    string-naming-requests-get: {imports: [requests], callee: print, resolution: unresolved, a0: "requests.get('/x')"}
    no-call-record: {imports: [requests], callee: null}
    get-without-an-argument: {imports: [requests], callee: get, resolution: unresolved, a0: null}
    other-verb-name: {imports: [requests], callee: getter, resolution: unresolved, a0: /health}
    # P1-51a: the externalTarget strings of the proving repository's verb-named callsites (import gate satisfied, URL-like argument):
    # the typed seed is an exact pair, so none of them is a consumer. A glob or `resolution: [unresolved, external]` would seed them.
    typing-mapping-get: {imports: [requests], callee: get, resolution: external, external: "typing.Mapping.get", a0: /looks/like/a/path}
    typing-any-get: {imports: [requests], callee: get, resolution: external, external: "typing.Any.get", a0: /looks/like/a/path}
    testclient-get: {imports: [requests], callee: get, resolution: external, external: "fastapi/testclient.py:<module>.TestClient.get", a0: /health}
    test-wrapper-client-get: {imports: [requests], callee: get, resolution: external, external: "tests/test_api.py:<module>.wf_client.get", a0: /health}
    pathlib-path-get: {imports: [requests], callee: get, resolution: external, external: "pathlib.py:<module>.Path.get", a0: /looks/like/a/path}
    json-loads-return-get: {imports: [httpx], callee: get, resolution: external, external: "json.py:<module>.loads.<returnValue>.get", a0: /looks/like/a/path}
    dict-get-return-get: {imports: [httpx], callee: get, resolution: external, external: "__builtin.dict.get.<returnValue>.get", a0: /looks/like/a/path}
    # synthetic (0 occurrences in the proving repository): the shape of another library's module-level verb; kills the narrow `*.py:<module>.get` globs
    other-library-get-with-the-verb-name-in-the-module: {imports: [requests], callee: get, resolution: external, external: "other.py:<module>.get", a0: /health}
    # synthetic KNOWN LIMIT (not a true negative): `Session` is listed as not covered (P1-49), so a typed Session call is a pinned miss.
    # The string is inferred from the `TestClient` analogs, not probed; a real one is likely `requests.py:<module>.Session.__init__.<returnValue>.get`.
    session-get-is-a-known-limit: {imports: [requests], callee: get, resolution: external, external: "requests.py:<module>.Session.get", a0: /health}
  py-post:
    testclient-post: {imports: [requests], callee: post, resolution: external, external: "fastapi/testclient.py:<module>.TestClient.post", a0: /jobs}
    testclient-init-return-post: {imports: [httpx], callee: post, resolution: external, external: "fastapi/testclient.py:<module>.TestClient.__init__.<returnValue>.post", a0: /jobs}
    untyped-post-of-a-non-url-string: {imports: [httpx], callee: post, resolution: unresolved, a0: payload}
    untyped-post-in-a-file-importing-no-http-client: {imports: [os], callee: post, resolution: unresolved, a0: /jobs}
  py-delete:
    falkordb-select-graph-delete: {imports: [requests], callee: delete, resolution: external, external: "FalkorDB.select_graph.delete", a0: /looks/like/a/path}
    testclient-delete: {imports: [httpx], callee: delete, resolution: external, external: "fastapi/testclient.py:<module>.TestClient.delete", a0: /items/1}
    untyped-delete-of-a-non-url-string: {imports: [requests], callee: delete, resolution: unresolved, a0: key}
  py-request:
    request-in-a-file-importing-no-urllib: {imports: [requests], callee: Request, resolution: external, external: "urllib.py:<module>.<member>(request).Request.__init__", a0: /x}
    another-library-request: {imports: [urllib.request], callee: Request, resolution: external, external: "fastapi.py:<module>.Request", a0: /x}
  py-urlopen:
    urlopen-of-a-non-url-string: {imports: [urllib.request], callee: urlopen, resolution: external, external: "urllib.py:<module>.<member>(request).urlopen", a0: payload}
    urlopen-in-a-file-importing-no-urllib: {imports: [requests], callee: urlopen, resolution: external, external: "urllib.py:<module>.<member>(request).urlopen", a0: /x}
