# P1-49: the Python HTTP consumer (`requests`, `httpx`, `urllib.request`). Not in the rule-pack spec (docs/plans/
# connected-code-graph-rule-pack-spec.md): `status: paper` is the only value the v1 format allows, not a claim that no runtime
# exists. Plan: docs/plans/connected-code-graph-p1-linking.md, P1-49 "Pack". Every shape is a lifting and the call itself is the
# lifting's own seed site (`ownSite`). Untyped `requests.get(u)` and `cfg.get("k")` are the same record in the stored bundles, so
# the gate is the file's import of the library (`scope.imports` on the seed) plus URL-likeness at the leaf (`urlLike`), never the
# seed alone. Not covered: `requests.request`, `Session`, `aiohttp`, `http.client`, an aliased import, a relative URL without a
# leading `/`, a fully unknown URL.
# Typed verbs (P1-51a): a verb call the extractor typed is `external` `requests.py:<module>.<verb>` (observed on the fixture build) and
# `httpx.py:<module>.<verb>` (ASSUMED by symmetry, observed nowhere); it is the second seed of each verb, an exact pair, never a glob or
# `resolution: [unresolved, external]` (`__builtin.dict.get`, `typing.Mapping.get`, `TestClient.get` are `external` too).
packFormat: 1
id: python-http-client
version: 0.1.0
kind: framework
vocabVersion: "1.0"
status: paper
link: [{kind: http, matcher: path-template}]
# `httpx.Client(base_url=...)` is no seed: its base URL only feeds the URL binding; the key is the path alone.
urlBindings:
  - id: httpx-client-base-url
    kinds: [http]
    urlSources:
      - {callsite: {callee: Client, externalTarget: {glob: "httpx.py:*Client.__init__"}}, arg: kw.base_url, scope: file}
liftings:
  - id: py-get
    role: {kind: http, slot: url}
    seeds:
      - {call: {callee: get, resolution: [unresolved]}, arg: a0, scope: {imports: [{module: {prefix: requests}}, {module: {prefix: httpx}}]}}
      - {call: {callee: get, externalTarget: [{exact: "requests.py:<module>.get"}, {exact: "httpx.py:<module>.get"}]}, arg: a0, scope: {imports: [{module: {prefix: requests}}, {module: {prefix: httpx}}]}}
    ownSite: true
    urlLike: true
  - id: py-post
    role: {kind: http, slot: url}
    seeds:
      - {call: {callee: post, resolution: [unresolved]}, arg: a0, scope: {imports: [{module: {prefix: requests}}, {module: {prefix: httpx}}]}}
      - {call: {callee: post, externalTarget: [{exact: "requests.py:<module>.post"}, {exact: "httpx.py:<module>.post"}]}, arg: a0, scope: {imports: [{module: {prefix: requests}}, {module: {prefix: httpx}}]}}
    ownSite: true
    urlLike: true
  - id: py-put
    role: {kind: http, slot: url}
    seeds:
      - {call: {callee: put, resolution: [unresolved]}, arg: a0, scope: {imports: [{module: {prefix: requests}}, {module: {prefix: httpx}}]}}
      - {call: {callee: put, externalTarget: [{exact: "requests.py:<module>.put"}, {exact: "httpx.py:<module>.put"}]}, arg: a0, scope: {imports: [{module: {prefix: requests}}, {module: {prefix: httpx}}]}}
    ownSite: true
    urlLike: true
  - id: py-patch
    role: {kind: http, slot: url}
    seeds:
      - {call: {callee: patch, resolution: [unresolved]}, arg: a0, scope: {imports: [{module: {prefix: requests}}, {module: {prefix: httpx}}]}}
      - {call: {callee: patch, externalTarget: [{exact: "requests.py:<module>.patch"}, {exact: "httpx.py:<module>.patch"}]}, arg: a0, scope: {imports: [{module: {prefix: requests}}, {module: {prefix: httpx}}]}}
    ownSite: true
    urlLike: true
  - id: py-delete
    role: {kind: http, slot: url}
    seeds:
      - {call: {callee: delete, resolution: [unresolved]}, arg: a0, scope: {imports: [{module: {prefix: requests}}, {module: {prefix: httpx}}]}}
      - {call: {callee: delete, externalTarget: [{exact: "requests.py:<module>.delete"}, {exact: "httpx.py:<module>.delete"}]}, arg: a0, scope: {imports: [{module: {prefix: requests}}, {module: {prefix: httpx}}]}}
    ownSite: true
    urlLike: true
  # `urllib.request.Request(url, method=...)`: a bare `Request(url)` is a GET; `data=` or `headers=` withhold the default.
  - id: py-request
    role: {kind: http, slot: url}
    seeds: [{call: {externalTarget: {glob: "urllib.py:*Request.__init__"}}, arg: a0, scope: {imports: [{module: {prefix: urllib}}]}}]
    companions: [{role: verb, arg: kw.method, bareDefault: GET, unknown: "*"}]
    ownSite: true
  # `urlopen(x)`: `urlopen(req)` takes a `Request` object, which is not URL-like, so it yields nothing.
  - id: py-urlopen
    role: {kind: http, slot: url}
    seeds: [{call: {externalTarget: {glob: "urllib.py:*urlopen"}}, arg: a0, scope: {imports: [{module: {prefix: urllib}}]}}]
    ownSite: true
    urlLike: true
rules:
  - id: get
    match: {lifted: {lifting: py-get}}
    extract: {url: {lifted: url}, verb: {literal: GET}}
    emit: [{consumes: {kind: http, key: "{verb} {url}"}}]
  - id: post
    match: {lifted: {lifting: py-post}}
    extract: {url: {lifted: url}, verb: {literal: POST}}
    emit: [{consumes: {kind: http, key: "{verb} {url}"}}]
  - id: put
    match: {lifted: {lifting: py-put}}
    extract: {url: {lifted: url}, verb: {literal: PUT}}
    emit: [{consumes: {kind: http, key: "{verb} {url}"}}]
  - id: patch
    match: {lifted: {lifting: py-patch}}
    extract: {url: {lifted: url}, verb: {literal: PATCH}}
    emit: [{consumes: {kind: http, key: "{verb} {url}"}}]
  - id: delete
    match: {lifted: {lifting: py-delete}}
    extract: {url: {lifted: url}, verb: {literal: DELETE}}
    emit: [{consumes: {kind: http, key: "{verb} {url}"}}]
  - id: request
    match: {lifted: {lifting: py-request}}
    extract: {url: {lifted: url}, verb: {lifted: verb}}
    emit: [{consumes: {kind: http, key: "{verb} {url}"}}]
  - id: urlopen
    match: {lifted: {lifting: py-urlopen}}
    extract: {url: {lifted: url}, verb: {literal: GET}}
    emit: [{consumes: {kind: http, key: "{verb} {url}"}}]
